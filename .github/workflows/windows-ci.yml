name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp_server/requirements-diagnostics.txt

      - name: Build MFC and run regression tests
        shell: pwsh
        run: ./ci/Invoke-WindowsCI.ps1

      - name: Upload build log and CTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-evidence
          path: |
            ci-artifacts/ctest.xml
            build-demo/build-demo.log
          if-no-files-found: ignore
